name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP 7.4 syntax / no strict_types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: php -l (PHP 7.4)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:7.4-cli sh -c \
            'find . -name "*.php" -not -path "./vendor/*" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l > /dev/null'
      - name: declare(strict_types) は使わない
        run: |
          if grep -rn --include='*.php' 'strict_types' --exclude-dir=vendor --exclude-dir=tests .; then
            echo "strict_types は使わない約束です（振る舞いが変わるため）"
            exit 1
          fi

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - run: tests/run-in-docker.sh ${{ matrix.php }}
