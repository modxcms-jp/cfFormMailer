<ul>[+errors|implodetag(li)+]</ul>
<form action="[~[*id*]~]" method="post" enctype="multipart/form-data">
  <label for="f_name">お名前</label>
  <input type="text" name="name" id="f_name" valid="1" />
  <label for="f_email">メールアドレス</label>
  <input type="text" name="email" id="f_email" valid="1:email" />
  <label for="f_zip">郵便番号</label>
  <input type="text" name="zip" id="f_zip" valid="1:zip,len(7)" />
  <label for="f_attach">添付ファイル</label>
  <input type="file" name="attach" id="f_attach" valid="1" />
  <img src="[+verimageurl+]" alt="" />
  <input type="text" name="veri" valid="1:vericode:画像認証" />
  <input type="submit" value="確認" />
</form>
