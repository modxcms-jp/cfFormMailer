# cfFormMailer for MODX configuration v1.7.0
#
# テスト用：送信（send）のときにも入力を検証し直すことを試すフォーム。
# 必須の項目・メールアドレス・必須のファイル・画像認証（vericode）を置く。

admin_mail = admin@example.com
admin_subject = 問い合わせ
admin_ishtml = 0
dynamic_send_to_field =

auto_reply = 1
reply_to = email
reply_subject = ありがとうございます
reply_ishtml = 0

tmpl_input = @FILE:assets/snippets/cfFormMailer/forms/_t/revalidate/web_form.tpl.html
tmpl_conf = @FILE:assets/snippets/cfFormMailer/forms/_t/revalidate/web_confirm.tpl.html
tmpl_comp = @FILE:assets/snippets/cfFormMailer/forms/sample/web_thanks.tpl.html
tmpl_mail_admin = @FILE:assets/snippets/cfFormMailer/forms/_t/revalidate/mail_receive.tpl.txt
tmpl_mail_reply = @FILE:assets/snippets/cfFormMailer/forms/_t/revalidate/mail_receive.tpl.txt

vericode = 1
invalid_class = invalid
upload_tmp_path = 1
send_mail = 1
