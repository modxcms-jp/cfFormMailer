# cfFormMailer for MODX configuration v1.7.0
#
# テスト用：管理者宛だけ HTML メール（admin_ishtml = 1、reply_ishtml = 0）。
# reply_to は「m1 + @ + m2」で組む。

admin_mail = admin@example.com
admin_subject = 問い合わせ
admin_ishtml = 1

auto_reply = 1
reply_to = m1+@+m2
reply_subject = ありがとうございます
reply_ishtml = 0

tmpl_input = @FILE:assets/snippets/cfFormMailer/forms/_t/mail_options/web_form.tpl.html
tmpl_conf = @FILE:assets/snippets/cfFormMailer/forms/_t/mail_options/web_confirm.tpl.html
tmpl_comp = @FILE:assets/snippets/cfFormMailer/forms/sample/web_thanks.tpl.html
tmpl_mail_admin = @FILE:assets/snippets/cfFormMailer/forms/_t/mail_options/mail.tpl.txt
tmpl_mail_reply = @FILE:assets/snippets/cfFormMailer/forms/_t/mail_options/mail.tpl.txt

allow_html = 0
send_mail = 1
