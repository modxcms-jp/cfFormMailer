<ul>[+errors|implodetag(li)+]</ul>
<form action="[~[*id*]~]" method="post">
  <input type="text" name="name" valid="1" />
  <select name="pref">
    <option value="">選んでください</option>
    <option value="tokyo" selected="selected">東京</option>
    <option value="osaka">大阪</option>
  </select>
  <select name="state">
    <option value="selected" selected>選択済み</option>
    <option value="unselected">未選択</option>
  </select>
  <input type="submit" value="確認" />
</form>
